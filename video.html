<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频</title>
  <style>
    /* 样式部分 (原 style.css) */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f5f5f5; color: #333; }
    
    /* 顶部搜索栏 */
    .header { position: fixed; top: 0; width: 100%; height: 56px; background: #fff; display: flex; padding: 10px 15px; gap: 10px; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .header input { flex: 1; padding: 8px 16px; border-radius: 20px; border: 1px solid #e0e0e0; outline: none; font-size: 15px; }
    .header button { padding: 8px 20px; border-radius: 20px; border: none; background: #00a1d6; color: #fff; font-size: 15px; cursor: pointer; }
    
    /* 状态与列表 */
    .status { margin-top: 76px; text-align: center; color: #999; font-size: 14px; }
    .grid { padding: 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    /* 视频卡片 */
    .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.2s; }
    .card:active { transform: scale(0.98); }
    .cover { width: 100%; aspect-ratio: 16/9; background: #eee center/cover no-repeat; position: relative; }
    .duration { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,0.7); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .info { padding: 10px; }
    .title { font-size: 14px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
    .meta { color: #999; font-size: 12px; margin-top: 6px; display: flex; justify-content: space-between; }
    
    /* 播放器弹窗 */
    .player-mask { display: none; position: fixed; inset: 0; background: #000; z-index: 200; flex-direction: column; justify-content: center; }
    .player-mask iframe { width: 100%; aspect-ratio: 16/9; border: none; }
    .close { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 28px; cursor: pointer; z-index: 201; }
  </style>
</head>
<body>

  <!-- 页面结构部分 (原 index.html) -->
  <div class="header">
    <input id="kw" type="text" placeholder="搜索视频...">
    <button onclick="search()">搜索</button>
  </div>

  <div id="status" class="status">输入关键词开始</div>

  <div id="grid" class="grid"></div>
  
  <div id="playerMask" class="player-mask">
    <div class="close" onclick="closePlayer()">✕</div>
    <iframe id="playerFrame" allowfullscreen></iframe>
  </div>

  <script>
    // 逻辑部分 (原 app.js)
    const PROXY = 'https://api.allorigins.win/raw?url=';

    async function search() {
      const kw = document.getElementById('kw').value.trim();
      if (!kw) return;
      
      const grid = document.getElementById('grid');
      const status = document.getElementById('status');
      
      status.textContent = '正在请求官方数据...';
      grid.innerHTML = '';
      
      try {
        const targetUrl = `https://m.bilibili.com/search?keyword=${encodeURIComponent(kw)}`;
        const res = await fetch(PROXY + encodeURIComponent(targetUrl));
        const html = await res.text();
        
        const match = html.match(/window\.__pinia\s*=\s*(\{.*?\});/s) || html.match(/window\.__INITIAL_STATE__\s*=\s*(\{.*?\});/s);
        if (!match) throw new Error('数据解析失败，官方结构可能变动');
        
        const data = JSON.parse(match[1]);
        const list = data?.search?.data || [];
        
        if (list.length === 0) {
          status.textContent = '未找到相关视频';
          return;
        }

        status.textContent = `找到 ${list.length} 个结果`;
        
        list.forEach(v => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => play(v.bvid);
          
          const pic = v.pic ? v.pic.replace(/^http:/, 'https:') : '';
          
          card.innerHTML = `
            <div class="cover" style="background-image:url('${pic}')">
              ${v.duration ? `<span class="duration">${v.duration}</span>` : ''}
            </div>
            <div class="info">
              <div class="title">${stripHtml(v.title)}</div>
              <div class="meta">
                <span>${v.author || '未知'}</span>
                <span>${formatNum(v.play)} 播放</span>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        status.textContent = ' 请求失败: ' + e.message;
      }
    }

    function play(bvid) {
      const frame = document.getElementById('playerFrame');
      frame.src = `https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=1&high_quality=1`;
      document.getElementById('playerMask').style.display = 'flex';
    }

    function closePlayer() {
      document.getElementById('playerFrame').src = '';
      document.getElementById('playerMask').style.display = 'none';
    }

    function stripHtml(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      return div.textContent || '';
    }

    function formatNum(num) {
      if (!num) return '0';
      return num >= 10000 ? (num / 10000).toFixed(1) + '万' : num;
    }
  </script>
</body>
</html>
