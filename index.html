<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilipili</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #fb7299;
            font-size: 48px;
            margin-bottom: 30px;
            margin-top: 0;
        }
        .video-placeholder {
            width: 300px;
            height: 200px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .video-placeholder:active {
            transform: scale(0.98);
        }
        .play-icon {
            width: 60px;
            height: 60px;
            background-color: #fb7299;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-icon::after {
            content: '';
            border: 15px solid transparent;
            border-left: 22px solid white;
            margin-left: 5px;
        }
        h2 {
            color: #333;
            font-size: 28px;
            margin-top: 30px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pilipili</h1>
        <a href="https://www.bilibili.com/" target="_blank" class="video-placeholder">
            <div class="play-icon"></div>
        </a>
        <h2>Watch videos!</h2>
        <p>这是一个用纯代码搭建的超酷个人网页。</p>
    </div>
</body>
</html>
