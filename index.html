<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilipili</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #fb7299;
            font-size: 48px;
            margin-bottom: 30px;
            margin-top: 0;
        }
        .video-box {
            width: 340px;
            height: 220px;
            background-color: #000;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        h2 {
            color: #333;
            font-size: 28px;
            margin-top: 35px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pilipili</h1>
        <!-- 这里是 B站视频播放器 -->
        <div class="video-box">
            <iframe src="https://player.bilibili.com/player.html?bvid=BV144411K7bN&page=1&high_quality=1" scrolling="no" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>
        </div>
        <h2>Watch videos!</h2>
        <p>这是一个用纯代码搭建的超酷个人网页。</p>
    </div>
</body>
</html>
