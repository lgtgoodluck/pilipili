<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilipili - 你的私人B站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            background-color: #f5f5f5;
            overflow: hidden; /* 禁止外层滚动，只让内部滚动 */
        }
        /* 你的专属粉色顶栏 */
        .top-bar {
            height: 50px;
            background-color: #FB7299;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
        }
        /* 套住 B 站的“大窗口” */
        .bili-window {
            width: 100%;
            height: calc(100% - 50px); /* 减去顶栏高度 */
            margin-top: 50px;
            border: none;
        }
    </style>
</head>
<body>
    <!-- 你的品牌标题 -->
    <div class="top-bar">Pilipili</div>
    
    <!-- 把 B站手机版首页套进来 -->
    <iframe 
        class="bili-window" 
        src="https://m.bilibili.com" 
        scrolling="yes"
        allowfullscreen>
    </iframe>
</body>
</html>
