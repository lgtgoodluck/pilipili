<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pilipili - 你的私人B站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; }
        /* 专属粉色顶栏 */
        .top-bar {
            height: 50px;
            background-color: #FB7299;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 20px; font-weight: bold;
            position: fixed; top: 0; left: 0; width: 100%; z-index: 999;
        }
        /* B站窗口：用 overflow:hidden 强行裁掉B站自带的头尾 */
        .bili-window {
            width: 100%;
            height: 120%; /* 让窗口比屏幕高，从而挤出B站的顶栏和底部弹窗 */
            margin-top: 50px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="top-bar">Pilipili</div>
    <!-- 注意：这里给 iframe 加了 overflow:hidden 的外层，试图裁切它 -->
    <div style="width: 100%; height: calc(100% - 50px); overflow: hidden; margin-top: 50px;">
        <iframe 
            class="bili-window" 
            src="https://m.bilibili.com" 
            scrolling="yes" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
